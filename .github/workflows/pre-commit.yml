# Run every hook in .pre-commit-config.yaml over the full repository, so CI
# enforces exactly what `pre-commit install` enforces locally: repo hygiene
# checks, pyupgrade (py311+), absolufy-imports, and ruff (import sorting +
# linting + formatting).
# This is the lint job: it runs on every push and every pull request.
name: pre-commit

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install pre-commit
        run: python -m pip install --upgrade pip pre-commit

      - name: Cache pre-commit hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.13-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run all pre-commit hooks on all files
        run: pre-commit run --all-files --show-diff-on-failure --color=always

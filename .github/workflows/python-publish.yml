# .github/workflows/python-publish.yml
# Pull requests and merges to main build the sdist/wheel as a check; only a
# GitHub release publishes to PyPI (the template's publish job runs for tag
# refs only).
name: Publish Python 🐍 distribution 📦 to PyPI and TestPyPI

on:
  release:
    types: [published]
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.rst'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.rst'

jobs:
  # check-codecov-token:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Check PYPI_TOKEN
  #       run: echo "2 PYPI_TOKEN=${{ secrets.PYPI_TOKEN }}"

  call-publish:
    uses: nrao/gh-actions-templates-public/.github/workflows/python-publish-cngi-template.yml@17-ci-python-312-314-push-pr-split
    with:
      pypi-url: "https://pypi.org/project/xradio"
    #secrets: inherit
    secrets:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }} # Explicit pass instead of inherit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
        # These files contain deliberate module-level strings after code:
        # PEP 224 attribute docstrings in the schema modules (rendered by
        # Sphinx), and long reference/provenance string blocks elsewhere.
        exclude: >-
          ^(src/xradio/measurement_set/schema\.py|src/xradio/schema/common\.py|src/xradio/schema/typing\.py|src/xradio/image/_util/_zarr/xds_from_zarr\.py|tests/stakeholder/test_measure_set_stakeholder\.py)$
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: requirements-txt-fixer
      - id: trailing-whitespace
        args: [--chars,"  "]

  - repo: https://github.com/asottile/pyupgrade
    rev: v2.38.2
    hooks:
      - id: pyupgrade
        args:
          - --py311-plus

  -   repo: https://github.com/MarcoGorelli/absolufy-imports
      rev: v0.3.1
      hooks:
      - id: absolufy-imports
        name: absolufy-imports

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.5
    hooks:
      - id: ruff-check        # linter + import sorting (see [tool.ruff.lint])
        args: [--fix]
      - id: ruff-format       # formatter (black replacement)

  # NOTE: no nbstripout hook here (unlike astroviper). The docs notebooks under
  # docs/source/ are rendered by nbsphinx from their *stored* outputs
  # (nbsphinx_execute defaults to "auto" and the guides need real telescope
  # data readthedocs cannot download) -- stripping outputs would blank the
  # rendered documentation.

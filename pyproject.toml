[project]
name = "xradio"
version = "v1.2.2"

description = " Xarray Radio Astronomy Data IO"
authors = [
    {name = "Jan-Willem Steeb", email="jsteeb@nrao.edu"},
    {name = "Federico Montesino Pouzols", email="pouzols@eso.edu"},
    {name = "Dave Mehringer", email="dmehring@nrao.edu"},
    {name = "Peter Wortmann", email="peter.wortmann@skao.int"}
]
license = {file = "LICENSE.txt"}
readme = "README.md"
requires-python = ">= 3.11, < 3.14"

dependencies = [
    'xarray'
]

[project.optional-dependencies]
zarr = [
    'astropy',
    'toolviper>=0.1.3',
    's3fs',
    'scipy',
    'xarray',
    'zarr>=3,<4',
    'pyarrow',
    'psutil' # psutil is needed so large FITS images are not loaded into memory
]
# toolviper has the following key dependencies also directly used by XRADIO (https://github.com/casangi/toolviper/blob/main/pyproject.toml):
#    'numpy',
#    'dask',
#    'distributed',

test = [
    'astropy',
    'toolviper>=0.1.3',
    's3fs',
    'scipy',
    'xarray',
    'zarr>=3,<4',
    'pyarrow',
    'psutil',
    'pytest',
    'pytest-cov',
    'pytest-html',
    'casacoretables'
]

# MSv2 -> MSv4 conversion and CASA image IO use `casacoretables`, a standalone,
# CASA-symbol-clash-free build of casacore's table system (replaces both
# python-casacore and casatools, on Linux and macOS alike). NOTE: PyPI wheels for
# casacoretables are not published yet, so `pip install xradio[casacore]` cannot
# resolve it from PyPI until they are; install it from source in the meantime.
casacore = [
    'astropy',
    'toolviper>=0.1.3',
    's3fs',
    'scipy',
    'xarray',
    'zarr>=3,<4',
    'pyarrow',
    'psutil',
    'casacoretables'
]

interactive = [
    'astropy',
    'toolviper>=0.1.3',
    's3fs',
    'scipy',
    'xarray',
    'zarr>=3,<4',
    'pyarrow',
    'psutil',
    'matplotlib',
    'prettytable',
    'jupyterlab',
    'ipykernel',
    'ipympl',
    'ipython',
    'jupyter-client',
]

docs = [
    'nbsphinx',
    'recommonmark',
    'scanpydoc',
    'sphinx-autoapi',
    'sphinx-autosummary-accessors',
    'sphinx_rtd_theme',
    'twine',
    'pandoc',
    'toolviper',
]

all = [
    'astropy',
    'toolviper>=0.1.3',
    's3fs',
    'scipy',
    'xarray',
    'zarr>=3,<4',
    'pyarrow',
    'psutil',
    'pytest',
    'pytest-cov',
    'pytest-html',
    'casacoretables',
    'matplotlib',
    'prettytable',
    'jupyterlab',
    'ipykernel',
    'ipympl',
    'ipython',
    'jupyter-client',
    'nbsphinx',
    'recommonmark',
    'scanpydoc',
    'sphinx-autoapi',
    'sphinx-autosummary-accessors',
    'sphinx_rtd_theme',
    'twine',
    'pandoc'
]

[tool.setuptools.package-data]
# Vendored standard-MS table descriptors, loaded at runtime by
# xradio.testing.measurement_set._casacore_ms (via importlib.resources) to build
# synthetic MSv2 test data on top of casacoretables.
"xradio.testing.measurement_set" = ["_ms_descriptors.json"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--strict-markers"
]
testpaths = [
    "tests"
]
pythonpath = [
    "."
]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.py$'

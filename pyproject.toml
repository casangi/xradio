[project]
name = "xradio"
version = "v1.2.2"

description = " Xarray Radio Astronomy Data IO"
authors = [
    {name = "Jan-Willem Steeb", email="jsteeb@nrao.edu"},
    {name = "Federico Montesino Pouzols", email="pouzols@eso.edu"},
    {name = "Dave Mehringer", email="dmehring@nrao.edu"},
    {name = "Peter Wortmann", email="peter.wortmann@skao.int"}
]
license = {file = "LICENSE.txt"}
readme = "README.md"
requires-python = ">= 3.11, < 3.14"

dependencies = [
    'xarray'
]

[project.optional-dependencies]
zarr = [
    'astropy',
    'toolviper>=0.1.3',
    's3fs',
    'scipy',
    'xarray',
    'zarr>=3,<4',
    'pyarrow',
    'psutil' # psutil is needed so large FITS images are not loaded into memory
]
# toolviper has the following key dependencies also directly used by XRADIO (https://github.com/casangi/toolviper/blob/main/pyproject.toml):
#    'numpy',
#    'dask',
#    'distributed',

test = [
    'astropy',
    'toolviper>=0.1.3',
    's3fs',
    'scipy',
    'xarray',
    'zarr>=3,<4',
    'pyarrow',
    'psutil',
    'pytest',
    'pytest-cov',
    'pytest-html',
    'arcae'
]

# casacore table access (MSv2 conversion and CASA image IO) through arcae,
# which ships self-contained wheels for Linux and macOS
casacore = [
    'astropy',
    'toolviper>=0.1.3',
    's3fs',
    'scipy',
    'xarray',
    'zarr>=3,<4',
    'pyarrow',
    'psutil',
    'arcae'
]

interactive = [
    'astropy',
    'toolviper>=0.1.3',
    's3fs',
    'scipy',
    'xarray',
    'zarr>=3,<4',
    'pyarrow',
    'psutil',
    'matplotlib',
    'prettytable',
    'jupyterlab',
    'ipykernel',
    'ipympl',
    'ipython',
    'jupyter-client',
]

docs = [
    'nbsphinx',
    'recommonmark',
    'scanpydoc',
    'sphinx-autoapi',
    'sphinx-autosummary-accessors',
    'sphinx_rtd_theme',
    'twine',
    'pandoc',
    'toolviper',
]

all = [
    'astropy',
    'toolviper>=0.1.3',
    's3fs',
    'scipy',
    'xarray',
    'zarr>=3,<4',
    'pyarrow',
    'psutil',
    'pytest',
    'pytest-cov',
    'pytest-html',
    'arcae',
    'matplotlib',
    'prettytable',
    'jupyterlab',
    'ipykernel',
    'ipympl',
    'ipython',
    'jupyter-client',
    'nbsphinx',
    'recommonmark',
    'scanpydoc',
    'sphinx-autoapi',
    'sphinx-autosummary-accessors',
    'sphinx_rtd_theme',
    'twine',
    'pandoc',
    'pre-commit'
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--strict-markers"
]
testpaths = [
    "tests"
]
pythonpath = [
    "."
]

[tool.ruff]
target-version = "py311"
# reviews/ holds archival schema-review notebooks (kept with their historical
# stored outputs); they are records, not maintained code -- don't lint/format.
extend-exclude = ["reviews"]

[tool.ruff.lint]
# Ruff replaces isort + black (layout via `ruff format`, import sorting via the
# "I" rules) and also lints for real defects and best practices:
#   E4/E7/E9 -- pycodestyle errors (import placement, statement syntax, runtime)
#   F        -- pyflakes: undefined names, unused imports, unused variables
#   B        -- flake8-bugbear: likely bugs (mutable defaults, loop captures, ...)
#   UP       -- pyupgrade: outdated syntax/typing (mirrors the pyupgrade hook)
select = ["E4", "E7", "E9", "F", "B", "UP", "I"]
# E741 (ambiguous variable name l/I/O): l and m are the standard radio-astronomy
# direction-cosine coordinate names in the image schema and must keep those names.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# Tutorial/guide notebooks introduce imports cell-by-cell as the narrative
# needs them (E402), and use try-import cells to probe for/install packages
# (F401); that is deliberate style, not an error.
"*.ipynb" = ["E402", "F401"]
